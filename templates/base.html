<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}QAIRA{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts + Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            display: flex;
            min-height: 100vh;
            background: #f5f5f5;
        }

        aside {
            width: 240px;
            background-color: #6200ea;
            color: white;
            padding: 2rem 1rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        aside h1 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }

        aside a {
            color: white;
            text-decoration: none;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        aside a:hover {
            background-color: #3700b3;
        }

        .container {
            flex: 1;
            padding: 2rem;
        }

        input, button {
            font-family: inherit;
            padding: 0.6rem;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-top: 0.5rem;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background-color: #6200ea;
            color: white;
            border: none;
            margin-top: 1rem;
            cursor: pointer;
        }

        button:hover {
            background-color: #3700b3;
        }

        @media (max-width: 768px) {
            aside {
                width: 100%;
                flex-direction: row;
                overflow-x: auto;
            }

            aside h1 {
                display: none;
            }

            aside a {
                flex: 1;
                justify-content: center;
            }

            .container {
                padding: 1rem;
            }
        }
        body.wiki-mode {
    background: #ececec;
        }

        .wiki-wrapper {
            display: flex;
            gap: 2rem;
        }

        .wiki-menu {
            width: 220px;
            background: #f3f3f3;
            padding: 1rem;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .wiki-menu ul {
            list-style: none;
            padding-left: 0;
        }

        .wiki-menu a {
            text-decoration: none;
            color: #6200ea;
        }

        .wiki-content {
            flex: 1;
            background: white;
            padding: 2rem;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        .editar-link {
            float: right;
            font-size: 0.8rem;
            color: #6200ea;
            text-decoration: none;
        }

        .comentario {
            background: #f9f9f9;
            padding: 1rem;
            border-left: 4px solid #6200ea;
            border-radius: 6px;
            margin-bottom: 1rem;
        }

        .responder button,
        .comentar {
            font-size: 0.85rem;
            background: transparent;
            border: none;
            color: #6200ea;
            cursor: pointer;
        }
    </style>
</head>
<body class="{% if request.path.startswith('/wiki') %}wiki-mode{% endif %}">
    <aside>
        <h1>🧪 QAIRA</h1>
        <a href="/auth"><span class="material-symbols-outlined">vpn_key</span>Autenticación</a>
        <a href="/form"><span class="material-symbols-outlined">search</span>Validar DataX</a>
        <a href="/tickets"><span class="material-symbols-outlined">table_chart</span>Client Solutions TEST</a>
        <a href="/test"><span class="material-symbols-outlined">science</span>Test</a>
        <a href="/wiki"><span class="material-symbols-outlined">menu_book</span>Wiki QA</a>

    </aside>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
